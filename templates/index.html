<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>미림당근 | 교내 무료 나눔</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      /* 선택된 카테고리 */
      .category-item.active {
        color: #ff7845;
      }

      .category-item.active svg {
        stroke: #ff7845;
      }

      .category-item.active span {
        color: #ff7845;
        font-weight: 700;
      }

      .category-item:hover {
        color: #ff7845;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- HEADER -->
      <header class="header">
        <div class="header-inner">
          <!-- 로고 -->
          <a href="{{ url_for('home') }}" class="logo">
            <img
              src="{{ url_for('static', filename='images/logo.png') }}"
              alt="미림당근"
            />
          </a>

          <!-- 네비게이션 -->
          <nav class="nav">
            <a href="{{ url_for('home') }}"> 나눔 둘러보기 </a>

            <a href="/mypage"> 나의 나눔 </a>

            <a href="/notice"> 공지 사항 </a>
          </nav>

          <!-- 사용자 메뉴 -->
          <div class="user-menu">
            {% if session.get("user_id") %}

            <div class="user-info">
              <span class="user-nickname">
                {{ session.get("nickname") }}님
              </span>

              <form action="{{ url_for('logout') }}" method="POST">
                <button type="submit" class="logout-button">로그아웃</button>
              </form>
            </div>

            {% else %}

            <a href="{{ url_for('login') }}"> 로그인 </a>

            <a href="{{ url_for('signup') }}"> 회원가입 </a>

            {% endif %}
          </div>
        </div>
      </header>

      <!-- MAIN -->
      <main class="main">
        <!-- 배너 -->
        <section class="banner">
          <img
            src="{{ url_for('static', filename='images/main-banner.png') }}"
            alt="함께 쓰면, 더 좋은 미림당근"
          />
        </section>

        <!-- CATEGORY -->
        <section class="category-section">
          <div class="category-list">
            <a
              href="/?category=all"
              class="category-item {% if selected_category == 'all' %}active{% endif %}"
            >
              <i data-lucide="grid-2x2"></i>
              <span>전체</span>
            </a>

            <a
              href="/?category=book"
              class="category-item {% if selected_category == 'book' %}active{% endif %}"
            >
              <i data-lucide="book-open"></i>
              <span>도서</span>
            </a>

            <a
              href="/?category=electronics"
              class="category-item {% if selected_category == 'electronics' %}active{% endif %}"
            >
              <i data-lucide="smartphone"></i>
              <span>전자기기</span>
            </a>

            <a
              href="/?category=stationery"
              class="category-item {% if selected_category == 'stationery' %}active{% endif %}"
            >
              <i data-lucide="pencil"></i>
              <span>학용품</span>
            </a>

            <a
              href="/?category=living"
              class="category-item {% if selected_category == 'living' %}active{% endif %}"
            >
              <i data-lucide="coffee"></i>
              <span>생활용품</span>
            </a>

            <a
              href="/?category=clothes"
              class="category-item {% if selected_category == 'clothes' %}active{% endif %}"
            >
              <i data-lucide="shirt"></i>
              <span>의류/잡화</span>
            </a>
          </div>
        </section>

        <!-- PRODUCT -->
        <section class="product-section">
          <h2 class="section-title">최근 등록된 나눔 물품</h2>

          <div class="product-grid">
            {% for item in items %}

            <article class="product-card">
              <!-- 사진 업로드 기능은 추후 추가 -->
              <div class="product-image"></div>

              <div class="product-info">
                <h3 class="product-title">{{ item.title }}</h3>

                <p class="product-category">{{ item.category_name }}</p>

                <span class="product-status"> {{ item.status }} </span>
              </div>
            </article>

            {% else %}

            <p class="empty-message">아직 등록된 나눔 물품이 없습니다.</p>

            {% endfor %}
          </div>
        </section>
      </main>

      <!-- FLOATING BUTTON -->
      <a
        href="{{ url_for('add') }}"
        class="floating-button"
        aria-label="나눔 등록하기"
      >
        <i data-lucide="plus"></i>
      </a>
    </div>

    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
