<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>미림당근</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <header>
      <h1>🥕 미림당근</h1>
      <p>우리 학교 무료 나눔 장터</p>
    </header>

    <main>
      <h2>나눔 물품 목록</h2>

      <div class="item-list">
        {% for item in items %}

        <div class="item-card">
          <h3>{{ item.title }}</h3>

          <p>{{ item.description }}</p>

          <p>카테고리: {{ item.category_name }}</p>

          <p>등록자: {{ item.nickname }}</p>

          <p>상태: {{ item.status }}</p>
        </div>

        {% else %}

        <p>아직 등록된 나눔 물품이 없습니다.</p>

        {% endfor %}
      </div>
    </main>
  </body>
</html>
